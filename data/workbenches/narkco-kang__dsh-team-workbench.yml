name: 智能体团队 · 技能管理工作台
nameEn: Agent Team Skill Workbench
category: operations
description:
  zh: 具名智能体团队工作台：每个成员有动态表情头像与一组可回退的模型路由，可私聊或建群；群里支持管理员先答、按内容自动挑人、只回应 @，并按接力层数让成员互相 @ 派活。内置 agency-agents-zh 的 313 个角色与「项目部」六组 15 人预设，支持分组视图、三级审批流水线与本机共享技能库。
  en: A named-agent team workbench with animated mascot avatars and fallback model routes, one-to-one chats and group rooms where a lead answers, an auto picker chooses the best-fit member, or only @mentions respond, with configurable @-relay depth. Includes 313 agency-agents-zh roles, a six-group project-department preset, grouped views, a three-stage approval pipeline and a local shared skill library.
