name: Trusted catalog PR gate

on:
  workflow_run:
    workflows: [Catalog candidate]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  gate:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted main code only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Read and probe candidate YAML without executing PR code
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: node scripts/trusted-pr-gate.mjs
      - name: Report incomplete probe
        if: ${{ steps.gate.outputs.gate_status == 'incomplete' }}
        run: echo "### ⚪ 探测暂未完成\n远程服务不可用或触发限流，请稍后重新运行。" >> "$GITHUB_STEP_SUMMARY"
