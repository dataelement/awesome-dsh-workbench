name: Trusted catalog PR gate

on:
  workflow_run:
    workflows: [Catalog candidate]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  gate:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted main code only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Read and probe candidate YAML without executing PR code
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/trusted-pr-gate.mjs
