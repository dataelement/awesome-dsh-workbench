name: Workbench security review
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
permissions:
  contents: read
  pull-requests: read
  checks: write
concurrency:
  group: workbench-security-${{ github.event.pull_request.number }}
  cancel-in-progress: false # complete an explicit head-bound check even when superseded
jobs:
  review:
    name: Run trusted security reviewer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted base code only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Probe and review immutable submission evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/security-pr-gate.mjs
